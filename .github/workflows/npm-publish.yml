name: Publish Package to npmjs
on:
  release:
    types: [published]
  # Manual retry, for when a publish fails after the release is already out.
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint the OIDC token that npm trades for publish rights.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Trusted publishing requires Node >= 22.14.0.
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      # ...and npm >= 11.5.1, which is newer than the npm bundled with Node.
      - run: npm install -g npm@latest
      - run: npm ci
      # No NODE_AUTH_TOKEN: auth comes from the OIDC token via the trusted publisher
      # configured on npmjs.com. Provenance is attested automatically under trusted
      # publishing, so --provenance is no longer needed.
      - run: npm publish --access public
